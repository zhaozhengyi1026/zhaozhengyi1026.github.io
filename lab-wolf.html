<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="保留完整 WebGL、拖拽与滚动效果的狼头互动实验。">
  <title>狼头｜实验室</title>
  <link rel="icon" href="images/life-avatar-favicon.jpg" type="image/jpeg">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    .wolf-brand { position: fixed; z-index: 40; top: 18px; left: 18px; display: inline-flex; align-items: center; min-height: 42px; color: #111; font: italic 750 15px/1 Arial, sans-serif; letter-spacing: -.03em; white-space: nowrap; pointer-events: none; }
    .wolf-countdown { position: fixed; z-index: 30; top: calc(50% + 145px); left: 50%; color: #27313a; font: 18px/1 ui-monospace, Consolas, monospace; letter-spacing: .16em; transform: translateX(-50%); transition: opacity .3s ease; }
    .wolf-ready { position: fixed; z-index: 30; top: 50%; left: 50%; color: #27313a; font: 700 20px/1 Arial, sans-serif; white-space: nowrap; transform: translate(-50%, -50%); transition: opacity .3s ease; }
    .wolf-countdown.is-done, .wolf-ready.is-done { opacity: 0; }
    .lab-return { position: fixed; z-index: 40; top: 18px; right: 18px; display: inline-flex; align-items: center; justify-content: center; min-width: 104px; height: 42px; padding: 0 18px; border: 1px solid rgba(17,17,17,.82); border-radius: 999px; color: #111; background: rgba(255,255,255,.92); box-shadow: 0 8px 28px rgba(0,0,0,.12); font: 600 13px/1 "Microsoft YaHei", sans-serif; text-decoration: none; white-space: nowrap; -webkit-font-smoothing: antialiased; transition: color .25s ease, background .25s ease, top .35s cubic-bezier(.22,1,.36,1), bottom .35s cubic-bezier(.22,1,.36,1), transform .25s ease; }
    .lab-return.is-at-bottom { top: auto; bottom: 18px; }
    .lab-return:hover { color: #fff; background: #111; transform: translateY(-2px); }
    .lab-return:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <iframe id="wolf-frame" src="lab-experiments/wolf/index.html" title="狼头互动实验" allow="autoplay; fullscreen"></iframe>
  <span class="wolf-brand" aria-label="Repeat Lab">Repeat/Lab</span>
  <a class="lab-return" href="lab.html">返回实验室</a>
  <span class="wolf-ready" aria-hidden="true">Are You Ready</span>
  <span class="wolf-countdown" aria-hidden="true">3</span>
  <script>
    const frame = document.querySelector('#wolf-frame');
    const wolfReady = document.querySelector('.wolf-ready');
    const wolfCountdown = document.querySelector('.wolf-countdown');
    const labReturn = document.querySelector('.lab-return');

    frame.addEventListener('load', () => {
      const frameDocument = frame.contentDocument;
      const root = frameDocument?.querySelector('#root');
      if (!frameDocument || !root) return;

      const cleanWolfPage = () => {
        frameDocument.querySelectorAll('header, #s1-cta').forEach((element) => {
          element.style.setProperty('display', 'none', 'important');
        });

        const globe = frameDocument.querySelector('svg.w-10.h-6');
        const infoCard = globe?.closest('div.flex.border');
        if (infoCard) infoCard.style.setProperty('display', 'none', 'important');

        frameDocument.querySelectorAll('a[href="/contact"]').forEach((anchor) => {
          anchor.style.setProperty('display', 'none', 'important');
        });

        const walker = frameDocument.createTreeWalker(root, frame.contentWindow.NodeFilter.SHOW_TEXT);
        const textNodes = [];
        while (walker.nextNode()) textNodes.push(walker.currentNode);
        textNodes.forEach((node) => {
          const text = node.nodeValue.trim();
          if (!text) return;
          const parent = node.parentElement;
          if (!parent) return;
          if (/^feylin$/i.test(text)) {
            node.nodeValue = '';
            return;
          }
          const keepLoader = text === '+';
          if (!keepLoader) node.nodeValue = '';
        });
      };

      const updateReturnPosition = () => {
        const scrollingElement = frameDocument.scrollingElement;
        if (!scrollingElement) return;
        const canScroll = scrollingElement.scrollHeight > frame.contentWindow.innerHeight + 120;
        const nearBottom = scrollingElement.scrollTop + frame.contentWindow.innerHeight >= scrollingElement.scrollHeight - 120;
        labReturn.classList.toggle('is-at-bottom', canScroll && nearBottom);
      };

      new MutationObserver(() => {
        cleanWolfPage();
        updateReturnPosition();
      }).observe(root, { childList: true, characterData: true, subtree: true });
      frame.contentWindow.addEventListener('scroll', updateReturnPosition, { passive: true });
      frame.contentWindow.addEventListener('resize', updateReturnPosition);
      cleanWolfPage();
      updateReturnPosition();
    });

    let remaining = 3;
    const countdownTimer = window.setInterval(() => {
      remaining -= 1;
      if (remaining > 0) {
        wolfCountdown.textContent = String(remaining);
        return;
      }
      window.clearInterval(countdownTimer);
      wolfReady.classList.add('is-done');
      wolfCountdown.classList.add('is-done');
    }, 1000);
  </script>
</body>
</html>
